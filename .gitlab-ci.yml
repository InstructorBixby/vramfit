# The docker runner on hv1. Nothing in here needs a GPU, which is
# most of the reason the tests are arithmetic over committed header
# fixtures rather than against a card.
#
# There is no Windows runner on this instance, so the Windows path --
# the nvidia-smi fallback and the ledger's default path -- gets checked
# by hand on the work laptop and nowhere else. Written down because the
# absence of a red pipeline is not evidence about it.
stages:
  - test
  - docs
  - maintenance

.py:
  image: python:$PY-slim
  before_script:
    - pip install -e ".[dev]"

test:
  extends: .py
  stage: test
  parallel:
    matrix:
      - PY: ["3.10", "3.11", "3.12", "3.13"]
  script:
    - pytest --cov --cov-report=term-missing
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'

lint:
  extends: .py
  stage: test
  variables:
    PY: "3.12"
  script:
    - ruff check .
    - mypy vramfit

docs:
  # --strict, because a broken link in the budget page is how I end up
  # re-deriving a term I already wrote down.
  stage: docs
  image: python:3.12-slim
  before_script:
    - pip install -e ".[docs]"
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  # Same build; this is the one the instance serves, so I can read the
  # budget page on the phone instead of opening the checkout.
  stage: docs
  image: python:3.12-slim
  before_script:
    - pip install -e ".[docs]"
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

freshness:
  # Nothing is going to open a merge request here on its own. A weekly
  # scheduled pipeline tells me what has drifted and then I decide,
  # which is the same outcome with one fewer moving part. Allowed to
  # fail, because drift is information and not a broken build.
  extends: .py
  stage: maintenance
  variables:
    PY: "3.12"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
  script:
    - pip list --outdated
