site_name: vramfit
site_description: Predict whether a model fits in your VRAM, then measure what it does
repo_url: https://git.c01n31.net/c01n31pan1c/vramfit
edit_uri: -/edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: dark}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: light}

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - FAQ: faq.md
  - How it works:
      - The VRAM budget: budget.md
      - The two speeds: speed.md
      - Partial offload: offload.md
      - Mixture of experts: moe.md
      - Backends: backends.md
      - The card table: cards.md
  - Measurements:
      - Keeping the numbers: ledger.md
      - What I have measured: measured.md
      - Recording one off-box: measuring.md
      - Three numbers I lost: unreproducible.md
      - What the ledger caught: findings.md
  - Running out later: oom.md
  - Where this is wrong: wrong.md
  - Notes to self:
      - What I cannot break: stability.md
      - How this breaks: failure-modes.md
      - Working on this: working-on-this.md
      - Two checklists: checklists.md
      - Releasing: releasing.md
