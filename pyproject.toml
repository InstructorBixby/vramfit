[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vramfit"
version = "0.6.0"
description = "Predict whether a model fits in your VRAM, then measure what it does"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "c01n31pan1c", email = "panic@c01n31.net"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]
nvml = ["nvidia-ml-py>=12"]

[project.scripts]
vramfit = "vramfit.cli:main"

[tool.setuptools.packages.find]
include = ["vramfit*"]

[tool.setuptools.package-data]
vramfit = ["data/*.csv"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
