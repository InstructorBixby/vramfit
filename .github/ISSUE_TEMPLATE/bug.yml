name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: vramfit version
      description: "`vramfit --version`"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
